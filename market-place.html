<!DOCTYPE html>
<html lang="en-US">
<head>
  <link href="css/bootstrap.css" rel="stylesheet" type="text/css">
  <link href="css/styles.css" rel="stylesheet" type="text/css">
  <script src="js/scripts.js"></script>
  <title>Jazmin's Jewelry store</title>
</head>
<body>
  <div class="container">
    <div class="jumbotron">
      <h1>Jazmin's Jewelry Store</h1>
    </div>
  </div>

  <form id="items">
    <p id="item-error" class="hidden">Please select item.</p>
    <div class="row">
      <div class="col-sm-12">
        <label for="necklace">Necklace: 120.99</label>
        <input type="radio" name="jewelry" id="necklace" value="120.99">
      </div>
      <div class="col-sm-12">
        <label for="bracelet">Bracelet: 100.99</label>
        <input type="radio" name="jewelry" id="bracelet" value="100.99">
      </div>
      <div class="col-sm-12">
        <label for="earrings">Earrings: 50.99 each</label>
        <input type="radio" name="jewelry" id="earrings" value="50.99">
      </div>
    </div>
    <button type="submit">Add to cart</button>
  </form>

  <form id="shipping" class="hidden">
    <p id="shipping-error" class="hidden">Please fill out shipping information.</p>
    <div class="form-row">
      <div class="form-control col-md-6">
        <label for="fname">Enter Name</label>
        <input type="text" name="fname" id="fname">
      </div>
      <div class="form-control col-md-6">
        <label for="caddress">Enter Address</label>
        <input type="text" id="caddress" name="caddress">
      </div>
      <div class="form-control col-md-6">
        <label for="cemail">Enter Email</label>
        <input type="email" id="cemail" name="cemail">
      </div>
      <div class="form-control col-md-6">
        <label for="city">Enter City</label>
        <input type="text" id="city" name="city">
      </div>
      <div class="form-control col-md-6">
        <label for="state">Select State</label>
        <select id="state">
          <option selected>Choose...</option>
          <option>Oregon</option>
          <option>New York</option>
          <option>Washington</option>
          <option>Ohio</option>
          <option>Texas</option>
          <option>Florida</option>
          <option>California</option>
          <option>Idaho</option>
        </select>
      </div>
      <div class="form-control col-md-6">
        <label for="zip">Enter Zip</label>
        <input type="text" id="zip">
      </div>
    </div>  
    <button type="submit" class="m-2">Go on to payment</button>
  </form>

  <form id="payment" class="hidden">
    <p id="payment-error" class="hidden">Please enter payment information.</p>
    <div class="form-row">
      <div class="col-50">
        <div class="icon-container">
          <i class="fa fa-cc-visa"></i>
          <i class="fa fa-cc-amex"></i>
          <i class="fa fa-cc-mastercard"></i>
          <i class="fa fa-cc-discover"></i>
      </div>
      <label for="cname">Name on card</label>
      <input type="text" id="cname" name="card-name">
      <label for="ccnum">Card number</label>
      <input type="text" id="ccnum" name="card-number">
      <label for="expmonth">Exp Month</label>
      <input type="text" id="expmonth" name="expmonth">
      <label for="expyear">Exp Year</label>
      <input type="text" id="expyear" name="expyear">
      <label for="cvv">CVV</label>
      <input type="text" id="cvv" name="cvv">
      <button type="submit">Complete Purchase</button>
    </div>
  </form>

  <div id="recipe" class="hidden">
    <h1>Items and total amount</h1>
    <p>
      <span id="price">______________</span> with a 25% off discount bringing your total to <span id="price-minus-25%">_________</span>
    </p>
  </div>
</body>  
</html>
